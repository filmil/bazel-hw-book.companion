name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # Everything here comes from Bazel modules. GHDL is built from Ada
      # source through @ghdl. Unlike the manuscript repository, this one
      # needs only bazel from the image.
      - name: Build and test every listing
        run: bazel test //... --test_output=errors
      # Chapter 1 claims that Bazel derives the compile order from the
      # graph. This step checks the claim: with the deps edge gone, the
      # build must fail and name the missing library.
      - name: The derived-order claim must actually hold
        run: |
          cp design/counter/BUILD.bazel /tmp/keep
          sed -i '/deps = \["\/\/design\/util"\],/d' design/counter/BUILD.bazel
          if bazel build //design/counter:counter_pkg_lib 2>/tmp/err; then
            cp /tmp/keep design/counter/BUILD.bazel
            echo "FAIL: the build succeeded without the deps edge, so"
            echo "Chapter 1's derived-compile-order claim is now false."
            exit 1
          fi
          cp /tmp/keep design/counter/BUILD.bazel
          grep -q 'cannot find resource library "util"' /tmp/err || {
            echo "FAIL: it failed, but not with the located error the"
            echo "book promises. Actual:"; cat /tmp/err; exit 1; }
          echo "confirmed: without the deps edge, GHDL cannot find the"
          echo "util package"
