name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # Everything here comes from Bazel modules. GHDL is built from Ada
      # source through @ghdl, and NVC from C source through @nvc. Unlike
      # the manuscript repository, this one needs only bazel and a C
      # compiler from the image.
      - name: Build and test every listing
        run: bazel test //... --test_output=errors
      # Chapter 1 claims that Bazel derives the compile order from the
      # graph. This step checks the claim: with the deps edge gone, the
      # build must fail and name the missing library.
      - name: The derived-order claim must actually hold
        run: |
          cp design/counter/BUILD.bazel /tmp/keep
          sed -i '/deps = \["\/\/design\/util"\],/d' design/counter/BUILD.bazel
          if bazel build //design/counter:counter_pkg_lib 2>/tmp/err; then
            cp /tmp/keep design/counter/BUILD.bazel
            echo "FAIL: the build succeeded without the deps edge, so"
            echo "Chapter 1's derived-compile-order claim is now false."
            exit 1
          fi
          cp /tmp/keep design/counter/BUILD.bazel
          grep -q 'cannot find resource library "util"' /tmp/err || {
            echo "FAIL: it failed, but not with the located error the"
            echo "book promises. Actual:"; cat /tmp/err; exit 1; }
          echo "confirmed: without the deps edge, GHDL cannot find the"
          echo "util package"
      # Chapter 3 claims that a symbolic macro rejects a misspelled
      # attribute at the call site. Misspell srcs in the symbolic
      # vhdl_test call and check that loading fails with that error.
      - name: The symbolic-macro claim must actually hold
        run: |
          cp ch03/BUILD.bazel /tmp/keep3
          sed -i '/name = "counter_sim"/,/^)/ s/srcs =/sources =/' ch03/BUILD.bazel
          if bazel build //ch03:all 2>/tmp/err3; then
            cp /tmp/keep3 ch03/BUILD.bazel
            echo "FAIL: the misspelled attribute was accepted."
            exit 1
          fi
          cp /tmp/keep3 ch03/BUILD.bazel
          grep -q "no such attribute 'sources' in 'vhdl_test' macro" /tmp/err3 || {
            echo "FAIL: loading failed, but not with the error the book"
            echo "promises. Actual:"; cat /tmp/err3; exit 1; }
          echo "confirmed: the symbolic macro names the misspelled attribute"
      # Chapter 18 prints an aspect command that no test can run, because
      # an aspect is a flag on the build. Run it as printed and check the
      # manifest part it writes for the tagged filegroup.
      - name: The Chapter 18 aspect command writes the manifest
        run: |
          bazel build //... \
              --aspects=@vhdl_ls_gen//vhdl_ls_aspect:\
          vhdl_ls.bzl%vhdl_ls_aspect \
              --output_groups=vhdl_ls_manifests
          cat bazel-bin/ch18/srcs.vhdl_ls_part
          grep -q '^some_library.files = \[' bazel-bin/ch18/srcs.vhdl_ls_part
          grep -q '"ch18/my_vhdl_lib/my_package.vhd"' bazel-bin/ch18/srcs.vhdl_ls_part
